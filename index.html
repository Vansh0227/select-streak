/* ---------- render shell ---------- */
function render(){
  if(P) return;
  if(S.tab!=='profile') resetArmed=false;
  app.innerHTML = statBar() + (S.tab==='learn'?learnView():S.tab==='sandbox'?sandboxView():profileView()) + navBar();
}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t){ if(S.tab!==t.dataset.tab) fx('tap'); S.tab=t.dataset.tab; save(); render(); scrollTo(0,0); return }
  const n=e.target.closest('[data-lesson]');
  if(n){ const id=n.dataset.lesson;
    if(!unlocked(id)){ fx('deny'); return toast('Finish the lesson before this one to unlock it.') }
    tickHearts(); if(S.hearts<=0){ fx('heart'); return outOfHearts() }
    fx('select'); return startLesson(id) }
  const c=e.target.closest('[data-chip]'); if(c){ $('#sbx-sql').value=c.dataset.chip; runSandbox(); return }
  if(e.target.closest('#sbx-run')) return runSandbox();
  if(e.target.closest('#reset-progress')){
    if(!resetArmed){ resetArmed=true; fx('deny'); render(); return }
    const keep={sound:S.sound,haptics:S.haptics}; resetArmed=false;
    S=Object.assign({xp:0,streak:0,last:null,done:{},hearts:HEART_MAX,heartAt:Date.now(),todayXp:0,todayDate:today(),tab:'learn',bestCombo:0,sandbox:S.sandbox},keep);
    save(); fx('tap'); render(); toast('Progress erased. Fresh start!'); return }
  if(e.target.closest('#sbx-reset')){ if(sandboxDb){sandboxDb.close(); sandboxDb=null} sbxResult=null; toast('Café data reset to the original rows.'); render() }
});
app.addEventListener('keydown',e=>{ if(e.target.id==='sbx-sql' && e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); runSandbox() } });
app.addEventListener('change',e=>{
  if(e.target.id==='set-sound'){ S.sound=e.target.checked; save(); fx('toggle') }
  if(e.target.id==='set-haptics'){ S.haptics=e.target.checked; save(); fx('toggle') }
});
app.addEventListener('input',e=>{ if(e.target.id==='sbx-sql'){ S.sandbox=e.target.value; save() } });

function outOfHearts(){
  const mins=Math.max(1,Math.ceil((S.heartAt+HEART_REFILL_MIN*6e4-Date.now())/6e4));
  const ov=document.createElement('div'); ov.className='player';
  ov.innerHTML=`<div class="done-screen">${byteWrap('judgey','hero-byte')}<h2>Out of hearts</h2>
    <p style="max-width:34ch;color:var(--text-soft)">A heart comes back every ${HEART_REFILL_MIN} minutes (next one in about ${mins} min). Or trade 20 XP for a full refill.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="refill" ${S.xp<20?'disabled':''}>Refill for 20 XP</button><button class="btn ghost" id="later">Practice instead</button></div></div>`;
  document.body.appendChild(ov);
  $('#refill',ov).onclick=()=>{ fx('correct'); S.xp-=20; S.hearts=HEART_MAX; S.heartAt=Date.now(); save(); ov.remove(); render(); toast('Hearts refilled.') };
  $('#later',ov).onclick=()=>{ ov.remove(); S.tab='sandbox'; save(); render() };
}

/* ---------- lesson player ---------- */
let P=null; // {lesson, queue, i, total, mistakes, answer, state, el}
function startLesson(id){
  const lesson=ALL.find(l=>l.id===id);
  P={combo:0, lesson, queue:lesson.ex.map((x,i)=>({...x,_k:i})), i:0, total:lesson.ex.length, right:0, mistakes:0, state:'answering', answer:null, firstTry:new Set()};
  P.el=document.createElement('div'); P.el.className='player'; document.body.appendChild(P.el);
  document.body.style.overflow='hidden';
  if(lesson.intro && !S.done[lesson.id]) drawIntro(); else drawEx();
}
function drawIntro(){
  const it=P.lesson.intro; P.state='answering';
  const res=SQL?run(it.code):null;
  P.el.innerHTML=`<div class="wrap p-top"><button class="x" id="quit" aria-label="Quit lesson">${ICON.x}</button><div class="prog"><i style="width:0%"></i></div><div class="p-stats"><span class="stat streak">${ICON.flame}${S.streak}</span><span class="stat hearts">${ICON.heart}${S.hearts}</span></div></div>
    <div class="p-body"><div class="wrap">
      <div class="prompt"><div class="mascot" id="mascot">${byteSvg('happy')}</div><div class="bubble"><div class="kind"><span class="newpill">New</span></div><div class="q">${esc(it.title)}</div></div></div>
      <p style="margin:0;font-size:17px;line-height:1.5">${esc(it.text)}</p>
      <div class="intro-ex">${codeCard(it.code,'Example')}${res&&!res.error?`<span class="lbl">It returns</span>${table(res,8)}`:''}</div>
    </div></div>
    <div class="sheet"><div class="wrap"><button class="btn" id="go">Got it</button></div></div>`;
  $('#quit',P.el).onclick=closeLesson;
  $('#go',P.el).onclick=()=>{ fx('select'); drawEx() }; $('#go',P.el).focus();
}
function askQuit(){
  if(!P) return; if(P.i===0 && P.state==='answering'){ closeLesson(); return }
  fx('deny'); const q=document.createElement('div'); q.className='quit-sheet';
  q.innerHTML=`<div class="card">${byteWrap('judgey')}<h3>Wait, don't go!</h3><p>You'll lose this lesson's progress if you quit now.</p>
    <button class="btn" id="stay">Keep learning</button><button class="btn danger" id="leave">End lesson</button></div>`;
  P.el.appendChild(q);
  $('#stay',q).onclick=()=>{ fx('tap'); q.remove() }; $('#leave',q).onclick=closeLesson;
  q.onclick=e=>{ if(e.target===q) q.remove() };
}
function closeLesson(){ if(!P) return; fx('tap'); P.el.remove(); P=null; document.body.style.overflow=''; render() }
function shuffle(a,seed){ a=a.slice(); let s=seed*9301+49297; for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }

/* ---------- table data for lessons ---------- */
const TABLE_ROWS=(()=>{ const out={}, re=/INSERT INTO (\w+) VALUES([\s\S]*?);/g; let m;
  while((m=re.exec(SEED))) out[m[1]]=[...m[2].matchAll(/\(([^()]*)\)/g)].map(t=>t[1].split(',').map(v=>{ v=v.trim(); return v==='NULL'?null:v[0]==="'"?v.slice(1,-1):Number(v) }));
  return out })();
const exText=(ex,withQ)=>[withQ?ex.q:'',ex.code,ex.answer,...(ex.tokens||[]),...(ex.extra||[]),...(ex.mono?ex.options:[])].filter(Boolean).join(' ').toLowerCase();
function tablesFor(ex){ if(ex.tables) return ex.tables; const t=exText(ex,true); return SCHEMA.map(s=>s.name).filter(n=>new RegExp('\\b'+n+'\\b').test(t)) }
function dataCard(ex){
  const names=tablesFor(ex); if(!names.length) return '';
  const txt=exText(ex,false);
  const panel=(n,i)=>{ const t=SCHEMA.find(s=>s.name===n), rows=TABLE_ROWS[n]||[];
    let hot=t.cols.map(c=>new RegExp('\\b'+c+'\\b').test(txt)); if(!hot.some(Boolean)||/select \*/.test(txt)) hot=hot.map(()=>true);
    return `<div class="dpanel" data-panel="${n}" ${i?'hidden':''}><div class="dscroll"><table><thead><tr>${t.cols.map((c,j)=>`<th class="${hot[j]?'hot':''}">${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>'<tr>'+r.map((v,j)=>`<td class="${hot[j]?'hot':''}">${v===null?'<i>NULL</i>':esc(v)}</td>`).join('')+'</tr>').join('')}</tbody></table></div><div class="dmeta">${n} · ${rows.length} rows</div></div>` };
  return `<section class="data" aria-label="Table data"><div class="dhead"><span class="dlabel">${ICON.table}Table data</span>
    <div class="dtabs">${names.map((n,i)=>`<button class="dtab" data-dtab="${n}" aria-selected="${!i}">${n}</button>`).join('')}</div></div>${names.map(panel).join('')}</section>`;
}
const KEYS=['SELECT','*','FROM','WHERE','=',',',"'",'(',')','AND','OR','AS','IS NULL','IN','ORDER BY','DESC','GROUP BY','HAVING','COUNT(*)','SUM(','AVG(','JOIN','LEFT JOIN','ON','LIMIT','CASE','WHEN','THEN','ELSE','END','WITH','OVER','PARTITION BY','>','<','.',';'];
const kbar=target=>`<div class="kbar" data-kbar="${target}" aria-label="Insert SQL keywords">${KEYS.map(k=>`<button type="button" class="${/^[A-Z]/.test(k)?'':'p'}" data-key="${esc(k)}">${esc(k)}</button>`).join('')}</div>`;
function insertKey(ta,k){
  const a=ta.selectionStart, b=ta.selectionEnd, before=ta.value.slice(0,a);
  const tight=/^[,;).]$/.test(k)||k.endsWith('('), lead=(!before||/[\s(.]$/.test(before)||/^[,;).]$/.test(k))?'':' ';
  const ins=lead+k+(tight&&k!==','?'':' ');
  if(k==="'"){ ta.setRangeText(lead+"''",a,b,'end'); ta.selectionStart=ta.selectionEnd=ta.selectionEnd-1 }
  else ta.setRangeText(ins,a,b,'end');
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}
document.addEventListener('pointerdown',e=>{ if(e.target.closest('[data-key]')) e.preventDefault() });
document.addEventListener('click',e=>{
  const k=e.target.closest('[data-key]');
  if(k){ const ta=document.getElementById(k.parentElement.dataset.kbar); if(ta&&!ta.readOnly){ haptic('tap'); insertKey(ta,k.dataset.key); ta.focus({preventScroll:true}) } return }
  const t=e.target.closest('[data-dtab]');
  if(t){ const card=t.closest('.data'); fx('tap');
    card.querySelectorAll('[data-dtab]').forEach(x=>x.setAttribute('aria-selected',x===t));
    card.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==t.dataset.dtab) }
});
const coarse=matchMedia('(pointer:coarse)').matches;
function optOrder(ex){ if(!ex._ord) ex._ord=shuffle(ex.options.map((_,i)=>i), Date.now()%997+ex.options.length); return ex._ord }
const KIND={mc:'Choose the answer', fill:'Fill in the blank', arrange:'Build the query', write:'Write the query'};
function drawEx(){
  const ex=P.queue[P.i]; P.state='answering'; P.answer=null; P.ex=ex;
  const pct=P.right/P.total*100;
  let body='';
  if(ex.t==='mc'){
    const short=ex.options.every(o=>o.length<=12);
    body=`${ex.code?codeCard(ex.code,'Read the query'):''}<div class="opts ${short?'grid2':''}">${optOrder(ex).map((i,pos)=>{ const o=ex.options[i]; return `<button class="opt ${ex.mono?'mono':''}" data-opt="${i}"><span class="n">${pos+1}</span><span>${esc(o)}</span></button>` }).join('')}</div>`;
  } else if(ex.t==='fill'){
    body=`${codeCard(ex.code,'Complete the query',null,'fillcode')}<div class="opts grid2">${optOrder(ex).map((i,pos)=>{ const o=ex.options[i]; return `<button class="opt mono" data-opt="${i}"><span class="n">${pos+1}</span><span>${esc(o)}</span></button>` }).join('')}</div>`;
  } else if(ex.t==='arrange'){
    P.picked=[]; P.bank=shuffle(ex.tokens.concat(ex.extra||[]), P.i+ex._k+ex.tokens.length);
    body=`<div class="ans-line" id="line" aria-label="Your query"></div><div class="bank" id="bank">${P.bank.map((t,i)=>`<button class="tok ${/^[A-Z][A-Z ]+$/.test(t)?'kwt':''}" data-tok="${i}">${esc(t)}</button>`).join('')}</div>`;
  } else if(ex.t==='write'){
    body=`<textarea id="w" class="sql" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" placeholder="SELECT …" aria-label="Your SQL query"></textarea>${kbar('w')}
      ${ex.hint?`<details class="peek"><summary>Need a hint?</summary><span class="hint mono">${esc(ex.hint)}</span></details>`:''}
      ${SQL?'':`<span class="engine">${engineState==='loading'?'Loading the SQL engine… your answer will be checked by text until it is ready.':'Checking by text match, because the SQL engine could not load.'}</span>`}`;
  }
  P.el.innerHTML=`<div class="wrap p-top"><button class="x" id="quit" aria-label="Quit lesson">${ICON.x}</button><div class="prog"><i style="width:${pct}%"></i></div><div class="p-stats"><span class="stat streak" title="Day streak">${ICON.flame}${S.streak}</span><span class="stat hearts" title="Hearts">${ICON.heart}${S.hearts}</span></div></div>
    <div class="p-body"><div class="wrap">
      <div class="prompt"><div class="mascot" id="mascot">${byteSvg("happy")}</div><div class="bubble"><div class="kind">${KIND[ex.t]}</div><div class="q">${esc(ex.q)}</div></div></div>
      ${dataCard(ex)}${body}</div></div>
    <div class="sheet" id="sheet"><div class="wrap"><div class="fb" id="fb" hidden></div><button class="btn" id="go" disabled>Check</button></div></div>`;
  bindEx();
}
function setReady(v){ $('#go',P.el).disabled=!v }
function bindEx(){
  const el=P.el, ex=P.ex;
  $('#quit',el).onclick=askQuit;

  el.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    if(P.state!=='answering') return;
    fx('select'); el.querySelectorAll('[data-opt]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); P.answer=+b.dataset.opt; setReady(true);
    if(ex.t==='fill') $('#fillcode',el).outerHTML=codeCard(ex.code,'Complete the query',ex.options[P.answer],'fillcode');
  });
  if(ex.t==='arrange'){
    const line=$('#line',el), bank=$('#bank',el);
    const draw=()=>{ line.innerHTML=P.picked.map((bi,pi)=>`<button class="tok ${/^[A-Z][A-Z ]+$/.test(P.bank[bi])?'kwt':''}" data-pi="${pi}">${esc(P.bank[bi])}</button>`).join('');
      bank.querySelectorAll('[data-tok]').forEach(b=>b.classList.toggle('used',P.picked.includes(+b.dataset.tok))); setReady(P.picked.length>0) };
    bank.onclick=e=>{ const b=e.target.closest('[data-tok]'); if(!b||P.state!=='answering'||P.picked.includes(+b.dataset.tok)) return; fx('select'); P.picked.push(+b.dataset.tok); draw() };
    line.onclick=e=>{ const b=e.target.closest('[data-pi]'); if(!b||P.state!=='answering') return; fx('tap'); P.picked.splice(+b.dataset.pi,1); draw() };
  }
  if(ex.t==='write'){ const w=$('#w',el); if(!coarse) w.focus(); w.oninput=()=>setReady(w.value.trim().length>0);
    w.onkeydown=e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); $('#go',el).click() } } }
  $('#go',el).onclick=()=>{ if(P.state==='answering') check(); else { haptic('tap'); next() } };
}
function check(){
  const ex=P.ex; let ok=false, msg='', show=null, correct='';
  if(ex.t==='mc'||ex.t==='fill'){ ok=P.answer===ex.a; correct=ex.options[ex.a]; msg=ex.why||'' }
  else {
    const sql = ex.t==='arrange' ? P.picked.map(i=>P.bank[i]).join(' ') : $('#w',P.el).value;
    correct=ex.answer;
    if(SQL){ const exp=runCheck(ex.answer,ex.check), got=runCheck(sql,ex.check); const r=sameResult(got,exp,ex.ordered); ok=r.ok; msg=ok?(ex.why||'Your query returns the right rows.'):r.msg; show=ok?got:exp }
    else { ok=norm(sql)===norm(ex.answer); msg=ok?(ex.why||''):(ex.why||'Compare your query with the answer below.') }
  }
  P.state='checked';
  P.combo = ok ? P.combo+1 : 0; if(P.combo>S.bestCombo){ S.bestCombo=P.combo; save() }
  fx(ok?'correct':'wrong'); if(ok && P.combo>=3) setTimeout(()=>fx('combo'),260);
  if(ok){ P.right++; if(!P.firstTry.has(ex._k)) P.firstTry.add(ex._k) }
  else { P.mistakes++; P.firstTry.add(ex._k); S.hearts=Math.max(0,S.hearts-1); if(S.hearts<HEART_MAX && S.hearts===HEART_MAX-1) S.heartAt=Date.now(); save(); P.queue.push(ex) }
  const sheet=$('#sheet',P.el), fb=$('#fb',P.el), go=$('#go',P.el);
  sheet.className='sheet '+(ok?'good':'wrong');
  const m=$('#mascot',P.el); m.innerHTML=byteSvg(ok?'cheer':'judgey'); m.className='mascot '+(ok?'hop':'shake');
  fb.hidden=false;
  fb.innerHTML=`${ok?ICON.okc:ICON.badc}<div class="fb-body"><h4>${ok?(['Excellent!','Nice work!','Great job!','You got it!'][P.right%4]):'Not quite right'}${ok&&P.combo>=3?`<span class="combo">${P.combo} in a row</span>`:''}</h4>${msg?`<p>${esc(msg)}</p>`:''}
    ${!ok?`<div class="correct"><b>Correct answer:</b> ${esc(correct)}</div>`:''}${show?`${ok?'':'<p style="margin-top:8px"><b>It returns:</b></p>'}${table(show,8)}`:''}</div>`;
  go.disabled=false; go.textContent='Continue'; go.className='btn '+(ok?'ok':'bad'); go.focus();
  P.el.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const w=$('#w',P.el); if(w) w.readOnly=true;
  $('.prog i',P.el).style.width=(P.right/P.total*100)+'%';
  const hs=$('.p-top .hearts',P.el); hs.innerHTML=ICON.heart+S.hearts; if(!ok){ hs.classList.remove('lose'); void hs.offsetWidth; hs.classList.add('lose') }
  if(!ok && S.hearts<=0){ go.textContent='Out of hearts'; go.onclick=()=>{ closeLesson(); outOfHearts() } }
}
function next(){ P.i++; if(P.i<P.queue.length) drawEx(); else finish() }
function finish(){
  const perfect=P.mistakes===0, gain=10+(perfect?5:0), first=!S.done[P.lesson.id];
  S.xp+=gain; S.todayXp+=gain; S.done[P.lesson.id]=true;
  if(S.last!==today()){ const gap=S.last?Math.round((new Date(today())-new Date(S.last))/DAY):99; S.streak=gap===1?S.streak+1:1; S.last=today() }
  save();
  const acc=Math.round(P.total/(P.total+P.mistakes)*100);
  P.el.innerHTML=`<div class="done-screen">
    ${byteWrap('cheer','hero-byte')}
    <h2>${perfect?'Perfect lesson!':'Lesson complete!'}</h2>
    <p style="margin:0;color:var(--text-soft);max-width:36ch">${esc(P.lesson.title)} ${first?'is done and the next lesson is unlocked.':'reviewed.'}</p>
    <div class="tiles">
      <div class="tile" style="border-color:var(--color-brand-yellow)"><div class="h" style="background:var(--color-brand-yellow)">XP earned</div><div class="v" style="color:var(--color-brand-yellow)">+${gain}</div></div>
      <div class="tile" style="border-color:var(--color-brand-green)"><div class="h" style="background:var(--color-brand-green)">Accuracy</div><div class="v" style="color:var(--color-brand-green)">${acc}%</div></div>
      <div class="tile" style="border-color:var(--color-brand-orange)"><div class="h" style="background:var(--color-brand-orange)">Streak</div><div class="v" style="color:var(--color-brand-orange)">${S.streak} day${S.streak===1?'':'s'}</div></div>
    </div>
    <button class="btn" id="cont" style="min-width:220px">Continue</button></div>`;
  $('#cont',P.el).onclick=closeLesson; $('#cont',P.el).focus();
  fx('complete'); confetti();
  const xv=$('.tile .v',P.el); let k=0; const iv=setInterval(()=>{ k++; xv.textContent='+'+k; if(k>=gain) clearInterval(iv) },40); xv.textContent='+0';
}
document.addEventListener('keydown',e=>{
  if(!P||e.target.tagName==='TEXTAREA') return;
  if(e.key==='Enter'){ const go=$('#go',P.el)||$('#cont',P.el); if(go&&!go.disabled){ e.preventDefault(); go.click() } }
  if(P.state==='answering' && /^[1-4]$/.test(e.key)){ const b=P.el.querySelectorAll('[data-opt]')[+e.key-1]; if(b) b.click() }
});

render();
try{ if(!sessionStorage.getItem('ss-splash')){ sessionStorage.setItem('ss-splash','1');
  const sp=document.createElement('div'); sp.className='splash'; sp.innerHTML=byteWrap('cheer','hero-byte')+'<h1>Select Streak</h1>';
  document.body.appendChild(sp); setTimeout(()=>sp.classList.add('out'),1100); setTimeout(()=>sp.remove(),1500) } }catch(e){}
};
</script>

(async function(){
  try{
    if(NATIVE&&NATIVE.Preferences){
      const r=await NATIVE.Preferences.get({key:'selectstreak'});
      if(r&&r.value&&!localStorage.getItem('selectstreak')) localStorage.setItem('selectstreak',r.value);
    }
    if(NATIVE&&NATIVE.StatusBar) NATIVE.StatusBar.setStyle({style:'DARK'}).catch(()=>{});
  }catch(e){}
  window.__startApp();
  try{ NATIVE&&NATIVE.SplashScreen&&NATIVE.SplashScreen.hide() }catch(e){}
